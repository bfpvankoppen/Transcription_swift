name: Praten
options:
  bundleIdPrefix: com.praten
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_OBJC_BRIDGING_HEADER: "Support/SherpaOnnx-Bridging-Header.h"
    OTHER_LDFLAGS:
      - "-lc++"
      - "-lsherpa-onnx-c-api"
      - "-lsherpa-onnx-core"
      - "-lonnxruntime"
      - "-lkaldi-decoder-core"
      - "-lkaldi-native-fbank-core"
      - "-lsherpa-onnx-kaldifst-core"
      - "-lsherpa-onnx-fst"
      - "-lsherpa-onnx-fstfar"
      - "-lssentencepiece_core"
      - "-lespeak-ng"
      - "-lpiper_phonemize"
      - "-lucd"
      - "-lkissfft-float"
    LIBRARY_SEARCH_PATHS:
      - "$(PROJECT_DIR)/../sherpa-onnx/build-swift-macos/install/lib"
    HEADER_SEARCH_PATHS:
      - "$(PROJECT_DIR)/../sherpa-onnx/build-swift-macos/install/include"

targets:
  Praten:
    type: application
    platform: macOS
    sources:
      - path: Sources/Parkeet
      - path: Resources/Assets.xcassets
    resources:
      - path: Resources/AppIcon.icns
      - path: Support/PrivacyInfo.xcprivacy
    postCompileScripts:
      - name: Copy Models to Bundle
        script: |
          MODEL_SRC="${PROJECT_DIR}/Resources/models"
          MODEL_DST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/models"

          echo "Copy Models: SRC=$MODEL_SRC DST=$MODEL_DST"

          if [ -d "$MODEL_SRC" ]; then
            mkdir -p "$MODEL_DST"
            rsync -a --delete "$MODEL_SRC/" "$MODEL_DST/"
            echo "Copied models to bundle ($(du -sh "$MODEL_DST" | cut -f1))"
          else
            echo "warning: Models directory not found at $MODEL_SRC"
            echo "warning: Run Scripts/download-model.sh to download the transcription model"
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        INFOPLIST_FILE: Support/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.praten.app
        PRODUCT_NAME: Praten
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Support/Praten-Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Support/Praten.entitlements
          SWIFT_OPTIMIZATION_LEVEL: "-O"
